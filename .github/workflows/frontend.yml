# Frontend CI (spec 002, plan step 11; AC 5).
#
# One job running `npm run gate` — the same script, in the same order, as a developer's machine:
# lint, typecheck, unit tests, the OpenAPI contract check, build, bundle check, suppressions,
# exact versions, npm audit, and the Playwright run against the real backend on a temp copy of
# its fixture. With `CI` set, the gate never skips the e2e stage.
#
# It runs when only `backend/openapi.json` changes (FR-API-03): a backend change that leaves
# the generated client stale must turn this workflow red until the frontend regenerates in a
# `contract:` commit (spec 002, R3-10). Backend code and fixtures trigger it too, because the
# e2e stage runs them.

name: frontend

on:
  push:
    branches: [main, "spec/**"]
    paths:
      - "frontend/**"
      - "backend/openapi.json"
      - "backend/app/**"
      - "backend/tests/fixtures/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/openapi.json"
      - "backend/app/**"
      - "backend/tests/fixtures/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the locked dependencies
        run: npm ci

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      # The e2e stage starts the real backend (e2e/backend.ts uses `uv run --no-sync`).
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync the backend's locked environment
        working-directory: backend
        run: uv sync --locked

      - name: Gate
        run: npm run gate
