# Backend of the novel-writing harness. Spec 001, plan step 2.
#
# Every dependency is pinned exactly (NFR-01): the model id per role is pinned in
# configuration and recorded per turn, so a provider-side change is attributable, and the
# same must be true of the libraries around it. `uv.lock` pins the transitive closure.

[project]
name = "my-story-marker-backend"
version = "0.1.0"
description = "Backend of the novel-writing harness: the only process that reads and writes the stores."
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
    "fastembed==0.8.0",
    "sqlite-vec==0.1.9",
    "sse-starlette==3.4.11",
]

[dependency-groups]
dev = [
    "ruff==0.16.8",
    "mypy==2.3.1",
    "bandit==1.9.4",
    "import-linter==2.15",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "hypothesis==6.168.0",
    # AC 4 generates round-trip cases from each model's own JSON Schema rather than from
    # hand-written examples: examples test the shapes the author thought of, the schema is
    # the contract the store layer is actually handed.
    "hypothesis-jsonschema==0.23.1",
    "schemathesis==4.27.5",
    "httpx==0.28.1",
    "types-PyYAML==6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --------------------------------------------------------------------------------------
# ruff — NFR-03
# --------------------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RET",       # return
    "ARG",       # unused arguments
    "ANN",       # annotations everywhere, to back mypy --strict
    "PTH",       # pathlib over os.path
    "TID",       # tidy imports
    "ISC",       # implicit string concat
    "PIE",
    "T20",       # no print outside scripts
    "RUF",
]
ignore = [
    "ANN401",    # dynamic typing is caught by mypy's disallow_any_explicit instead
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN", "ARG", "S101"]
"tests/**" = ["ANN", "ARG", "S101"]
"scripts/**" = ["T20"]
"tools/**" = ["T20"]
# N818 would have every exception end in `Error`. These nine names are fixed by IF-07 and
# are what the spec, the plan and the HTTP error codes all call them; renaming them to
# please a naming convention would make the code disagree with its own contract.
"app/commons/errors/__init__.py" = ["N818"]
# The annotated rule fixtures are deliberately wrong code: `semgrep/tests/<rule>.py`
# exists so the boundary rules can be shown to fire, line by line. Linting it would mean
# fixing the bug the fixture is made of.
"semgrep/tests/*.py" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# --------------------------------------------------------------------------------------
# mypy — NFR-02: strict, and no Any at all
# --------------------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
disallow_any_explicit = true
warn_unreachable = true
show_error_codes = true
exclude = ['^semgrep/tests/']

[[tool.mypy.overrides]]
# Third-party packages that ship no type information. Narrow, per-package, never global.
module = ["fastembed.*", "sqlite_vec.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------------------
# bandit — NFR-03. Default profile; B506 (yaml.load without SafeLoader) is the one that
# matters most here and is on by default.
# --------------------------------------------------------------------------------------

[tool.bandit]
# Test trees are excluded, not because their content does not matter, but because the
# only rule that fires there is B101 (`assert` is stripped under `python -O`). That is a
# statement about production code compiled with optimisations, and a test suite whose
# assertions bandit objects to is a test suite that would have to stop asserting.
exclude_dirs = ["semgrep", ".venv", "tests", "*/tests", "*/tests/*"]

# --------------------------------------------------------------------------------------
# pytest — NFR-09
# --------------------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["app", "tests"]
addopts = "--strict-markers -q"
markers = [
    "live: needs real model credentials; excluded unless --live is passed",
    "model: needs the real embedding model on disk; slow",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

# --------------------------------------------------------------------------------------
# import-linter — NFR-04. The module dependency contract of the spec, as build failures.
# --------------------------------------------------------------------------------------

[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

# NFR-04 as spec decision R3-3 reads it, and as architecture.md rules 2 and 5 state it: a
# feature calls another through its public surface (`service`, `models`) and never reaches
# into its `repository` or `router`. One contract per feature, because a forbidden contract
# cannot exempt a module from importing its own internals. `agents` has no repository or
# router until plan step 18; its rows gain them then.
[[tool.importlinter.contracts]]
name = "canon reaches other features only through their public surface"
type = "forbidden"
source_modules = ["app.canon"]
forbidden_modules = [
    "app.cast.repository",
    "app.cast.router",
    "app.scenes.repository",
    "app.scenes.router",
    "app.manuscript.repository",
    "app.manuscript.router",
    "app.ledger.repository",
    "app.ledger.router",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "cast reaches other features only through their public surface"
type = "forbidden"
source_modules = ["app.cast"]
forbidden_modules = [
    "app.canon.repository",
    "app.canon.router",
    "app.scenes.repository",
    "app.scenes.router",
    "app.manuscript.repository",
    "app.manuscript.router",
    "app.ledger.repository",
    "app.ledger.router",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "scenes reaches other features only through their public surface"
type = "forbidden"
source_modules = ["app.scenes"]
forbidden_modules = [
    "app.canon.repository",
    "app.canon.router",
    "app.cast.repository",
    "app.cast.router",
    "app.manuscript.repository",
    "app.manuscript.router",
    "app.ledger.repository",
    "app.ledger.router",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "manuscript reaches other features only through their public surface"
type = "forbidden"
source_modules = ["app.manuscript"]
forbidden_modules = [
    "app.canon.repository",
    "app.canon.router",
    "app.cast.repository",
    "app.cast.router",
    "app.scenes.repository",
    "app.scenes.router",
    "app.ledger.repository",
    "app.ledger.router",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "ledger reaches other features only through their public surface"
type = "forbidden"
source_modules = ["app.ledger"]
forbidden_modules = [
    "app.canon.repository",
    "app.canon.router",
    "app.cast.repository",
    "app.cast.router",
    "app.scenes.repository",
    "app.scenes.router",
    "app.manuscript.repository",
    "app.manuscript.router",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "agents reaches other features only through their public surface"
type = "forbidden"
source_modules = ["app.agents"]
forbidden_modules = [
    "app.canon.repository",
    "app.canon.router",
    "app.cast.repository",
    "app.cast.router",
    "app.scenes.repository",
    "app.scenes.router",
    "app.manuscript.repository",
    "app.manuscript.router",
    "app.ledger.repository",
    "app.ledger.router",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
# Rule 5: cycles are forbidden. Dependencies point downward only: the orchestrator composes
# scene operations, scene operations use the ledger's audit, and both read the data
# owners. `|` makes the three data owners independent of one another as well.
name = "Feature dependencies are acyclic and point downward"
type = "layers"
layers = [
    "app.agents",
    "app.scenes",
    "app.ledger",
    "app.canon | app.cast | app.manuscript",
]

[[tool.importlinter.contracts]]
name = "commons imports no feature"
type = "layers"
layers = [
    "app.canon : app.cast : app.scenes : app.manuscript : app.ledger : app.agents",
    "app.commons",
]

[[tool.importlinter.contracts]]
name = "commons is internally acyclic"
type = "layers"
layers = [
    "app.commons.stores : app.commons.db : app.commons.llm",
    "app.commons.permissions : app.commons.schemas : app.commons.embeddings",
    "app.commons.errors",
    "app.commons.config",
]

# `allow_indirect_imports` because the contract is about *direct* coupling: `app.main`
# reaching sqlite through `commons.db` is the design, not a breach. A module that names
# the library itself is what this forbids.
[[tool.importlinter.contracts]]
# Spec decision R3-1: model calls go through the Claude Code CLI as a subprocess, so the one
# module allowed to spawn a process is the model client. A process spawned anywhere else is a
# second door out of the backend that nothing audits. The embedder test that proves
# cross-process determinism is the named exception: it runs Python, not the model.
name = "Only commons.llm spawns subprocesses"
type = "forbidden"
source_modules = [
    "app.main",
    "app.canon", "app.cast", "app.scenes", "app.manuscript", "app.ledger", "app.agents",
    "app.commons.config", "app.commons.errors", "app.commons.permissions",
    "app.commons.schemas", "app.commons.stores", "app.commons.db",
    "app.commons.embeddings", "app.commons.deps",
]
forbidden_modules = ["subprocess"]
ignore_imports = [
    "app.commons.embeddings.tests.test_fake -> subprocess",
    "app.commons.embeddings.tests.test_fastembed -> subprocess",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only commons.embeddings imports fastembed"
type = "forbidden"
source_modules = [
    "app.main",
    "app.canon", "app.cast", "app.scenes", "app.manuscript", "app.ledger", "app.agents",
    "app.commons.config", "app.commons.errors", "app.commons.permissions",
    "app.commons.schemas", "app.commons.stores", "app.commons.db", "app.commons.llm",
]
forbidden_modules = ["fastembed"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only commons.db speaks SQLite"
type = "forbidden"
source_modules = [
    "app.main",
    "app.canon", "app.cast", "app.scenes", "app.manuscript", "app.ledger", "app.agents",
    "app.commons.config", "app.commons.errors", "app.commons.permissions",
    "app.commons.schemas", "app.commons.stores", "app.commons.embeddings",
    "app.commons.llm",
]
forbidden_modules = ["sqlite3", "sqlite_vec"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
# NFR-04, third bullet. import-linter can see an import but not the path it is applied to,
# so this contract keeps file primitives out of the features and the semgrep rule of AC 3
# is what actually proves no store path is touched outside commons/stores.
#
# The named exceptions are the orchestrator's own records under `.index/`, which is not a
# store, is not governed by Figure 3 and is written by the orchestrator directly
# (spec Decision R2-1, FR-TURN-06). The modules do not exist until step 18; the alerting is
# set to "none" so the contract holds before and after they land.
name = "Features reach the filesystem only through commons.stores"
type = "forbidden"
source_modules = [
    "app.canon", "app.cast", "app.scenes", "app.manuscript", "app.ledger", "app.agents",
]
forbidden_modules = ["os", "pathlib", "shutil", "tempfile", "glob"]
allow_indirect_imports = true
ignore_imports = [
    "app.agents.records -> pathlib",
    "app.agents.lock -> pathlib",
]
unmatched_ignore_imports_alerting = "none"
