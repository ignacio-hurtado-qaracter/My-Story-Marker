# AC 13 — no code path under `ledger/` or `agents/` resolves a collision by writing canon.
#
# `promote` is "the return edge: the only write path into canon during drafting, and the sole
# responsibility of the canoniser". When a proposed fact collides with an existing record it
# is escalated rather than resolved silently, and only `rule`, carrying `actor: human`,
# settles it (FR-OPS-06, FR-OPS-07).
#
# The failure this forbids is the one `architecture.md` names under ProposedFact: automatic
# promotion with no review. Canon fills with improvised noise and stops being authoritative,
# at which point it is no longer worth consulting -- and a harness whose canon is not worth
# consulting has nothing left to offer.
#
# Outside `promote()` and `rule()`, three shapes are refused:
#
# 1. A store write whose path names canon or cast: a literal `canon/...` or `cast/...`, or any
#    of the `paths` helpers and constants that build one.
# 2. A store write whose path is anything but a literal, an UPPER_CASE constant or a direct
#    `paths.<helper>(...)` call. A path held in a variable cannot be shown not to be canon,
#    and a variable is exactly how `promote` itself writes (`target.path`), so the one place
#    that shape is allowed is the one place a canon write belongs.
# 3. A call to a write function of the canon or cast service (`replace_*`, `save_*`).
#
# Test: `semgrep --test --config semgrep/ semgrep/tests/` against
# `semgrep/tests/canon-write-outside-promote.py`. Mirrored by
# `tools/check_boundaries.py::check_canon_write_outside_promote` (plan P8), which the same
# annotated file checks.

rules:
  - id: canon-write-outside-promote
    languages: [python]
    severity: ERROR
    message: >-
      Write to canon/ or cast/ from ledger/ or agents/ outside promote() or rule(), or a
      store write whose path cannot be shown not to be one. Canon has exactly two inbound
      write edges (Figure 3) and during drafting only the canoniser's promote() uses one of
      them; a collision is escalated to a human ruling (rule(), actor human), never resolved
      in place. Pass the path as a literal, an UPPER_CASE constant or a paths helper call.
    paths:
      include:
        - app/ledger/
        - app/agents/
      exclude:
        - "**/tests/**"
        # `.index/` owners: they never hold a Store and never import the store paths
        # (Decision R2-1), and their own file writes are the forbidden-store-write rule's.
        - app/agents/records.py
        - app/agents/lock.py
    patterns:
      - pattern-either:
          # 1: a store write whose path names canon or cast.
          - patterns:
              - pattern-either: &store-write
                  - pattern: $STORE.write($PATH, ...)
                  - pattern: $STORE.write_text($PATH, ...)
                  - pattern: $STORE.write(..., path=$PATH, ...)
                  - pattern: $STORE.write_text(..., path=$PATH, ...)
              - metavariable-regex:
                  metavariable: $PATH
                  regex: >-
                    ^(?:["'](?:canon|cast)(?:/|["'])|.*\bpaths\.(?:canon_entity|canon_dir|cast_file|cast_dir|CANON|CAST|PROJECT|STYLE|LEXICON|TIME|RELATIONSHIPS)\b)
          # 2: a store write whose path cannot be shown not to be canon.
          - patterns:
              - pattern-either: *store-write
              - metavariable-regex:
                  metavariable: $PATH
                  regex: >-
                    ^(?!["']|paths\.[a-z_]+\(|(?:[A-Za-z_][A-Za-z0-9_]*\.)*[A-Z][A-Z0-9_]*$)
          # 3: the owning feature's write functions.
          - patterns:
              - pattern-either:
                  - pattern: app.canon.service.$FN(...)
                  - pattern: app.cast.service.$FN(...)
              - metavariable-regex:
                  metavariable: $FN
                  regex: ^(?:replace|save)_
      - pattern-not-inside: |
          def promote(...):
            ...
      - pattern-not-inside: |
          def rule(...):
            ...
