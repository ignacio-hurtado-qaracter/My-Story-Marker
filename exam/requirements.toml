# Requisitos del examen final de Harness Engineering, como datos comprobables.
#
# Cada [[item]] es un requisito del enunciado. `checks` es una lista de comprobaciones;
# el item pasa si pasan todas, queda parcial si pasan algunas y falta si no pasa ninguna.
# `manual = true` marca lo que ningún script puede decidir (la calidad del CLAUDE.md, el
# email de entrega): aparece en el informe para que nadie lo olvide.
# `optional = true` marca los opcionales que suman nota; no cuentan para --strict.
# `any = true` hace que el item pase si pasa cualquiera de sus comprobaciones.
#
# Tipos de comprobación:
#   exists    alguna de `paths` existe
#   glob      al menos `min` ficheros casan con alguno de `patterns` (por defecto 1)
#   grep      `regex` aparece en ficheros que casan con `files` (al menos `min` veces)
#   no_match  `regex` NO aparece en ningún fichero versionado (git ls-files)
#
# Las comprobaciones son heurísticas: un ✅ dice que el artefacto existe, no que sea
# bueno. Las rutas marcadas "provisional" dependen de la ronda 1 del Proceso 0 de
# reencuadre (exam/process-0/round-1-rescope.md). Cuando se decidan, se corrigen aquí.
#
# Genera el informe:                 python exam/check.py
# Falla si falta algo obligatorio:   python exam/check.py --strict

# ---------------------------------------------------------------- Entregables del repo
[[item]]
id = "E01"
block = "Entregables"
text = "README.md en la raíz del repo"
checks = [{ kind = "exists", paths = ["README.md"] }]

[[item]]
